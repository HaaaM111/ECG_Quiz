<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECG 心电图识别训练 · 护理版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23D63031'/%3E%3Cpath d='M4 18h5l3-8 5 13 4-11 3 6h4' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ===== 基础与设计变量 ===== */
:root{
  --bg:#F1F5F9; --card:#FFFFFF; --ink:#20303F; --sub:#5D7184;
  --line:#E3EAF1; --ecg:#D63031; --ecg-dark:#A82324; --ok:#1E9E5F;
  --warn:#C77B1A; --monitor:#0E1E2B; --monitor-soft:#16303F; --wave:#3DDC84;
  --grid-lite:#E7EDF4; --grid-dark:#C9D5E2;
  --radius:14px; --shadow:0 2px 10px rgba(32,48,63,.06);
  --font:"Segoe UI","Microsoft YaHei","PingFang SC","Noto Sans SC","Helvetica Neue",Arial,sans-serif;
  --mono:"Consolas","Cascadia Mono","Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:auto}
body{
  font-family:var(--font); background:var(--bg); color:var(--ink);
  min-height:100vh; -webkit-font-smoothing:antialiased; line-height:1.6;
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
.hidden{display:none !important}

/* ===== 顶栏：监护条 ===== */
.monitor{
  background:linear-gradient(180deg,var(--monitor) 0%,var(--monitor-soft) 100%);
  color:#fff; overflow:hidden;
}
.monitor-inner{
  max-width:880px; margin:0 auto; padding:14px 20px 12px;
  display:flex; align-items:center; justify-content:space-between; gap:16px;
}
.brand{display:flex; align-items:center; gap:10px; font-size:17px; font-weight:700; letter-spacing:.3px; white-space:nowrap}
.brand .logo{flex:none}
.brand .sub{font-size:12px; font-weight:600; color:var(--wave); background:rgba(61,220,132,.12);
  border:1px solid rgba(61,220,132,.35); border-radius:999px; padding:1px 9px; margin-left:6px; letter-spacing:1px}
.monitor-wave{
  flex:1; max-width:340px; height:44px; position:relative; overflow:hidden;
  border-radius:8px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08);
}
.monitor-wave svg{position:absolute; inset:0; width:100%; height:100%}
.scan-line{
  position:absolute; top:0; bottom:0; width:26px; left:0;
  background:linear-gradient(90deg,rgba(61,220,132,0),rgba(61,220,132,.28) 50%,rgba(61,220,132,0));
  animation:scan 3.6s linear infinite;
}
@keyframes scan{0%{transform:translateX(-30px)}100%{transform:translateX(340px)}}

/* ===== 模式导航 ===== */
.mode-nav{
  max-width:880px; margin:18px auto 0; padding:0 20px;
  display:grid; grid-template-columns:repeat(5,1fr); gap:10px;
}
.mode-btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  min-height:44px;
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 6px; font-size:14px; font-weight:600; color:var(--sub);
  box-shadow:var(--shadow); transition:all .18s ease;
}
.mode-btn svg{flex:none}
.mode-btn:hover{border-color:#C9D5E2; color:var(--ink); transform:translateY(-1px)}
.mode-btn.active{
  background:var(--ink); border-color:var(--ink); color:#fff;
}
.mode-btn.active svg{stroke:#fff}
.mode-btn .badge{
  min-width:18px; height:18px; border-radius:999px; font-size:11px; font-weight:700;
  background:var(--ecg); color:#fff; display:inline-flex; align-items:center; justify-content:center; padding:0 5px;
}
.mode-btn:not(.active) .badge{background:var(--ecg)}

/* ===== 主容器 ===== */
main{max-width:880px; margin:0 auto; padding:16px 20px 40px}

/* ===== 卡片 ===== */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.sec-title{font-size:13px; font-weight:700; color:var(--sub); letter-spacing:1.5px; margin:20px 0 10px}

/* ===== 练习 / 考核 视图 ===== */
.quiz-head{display:flex; align-items:center; gap:12px; margin-bottom:12px}
.progress-track{flex:1; height:8px; background:#E3EAF1; border-radius:99px; overflow:hidden}
.progress-bar{height:100%; width:0%; background:linear-gradient(90deg,var(--ecg),#E8734F); border-radius:99px; transition:width .3s ease}
.quiz-meta{display:flex; gap:8px; align-items:center; font-size:12.5px; color:var(--sub); white-space:nowrap}
.tag{font-size:12.5px; font-weight:700; padding:2px 8px; border-radius:99px; border:1px solid var(--line); background:#F7FAFD; color:var(--sub)}
.tag.wave{color:var(--ecg-dark); border-color:#F2C4C4; background:#FCF1F1}
.tag.case{color:#2B6CB0; border-color:#C4DCF2; background:#F0F7FD}
.tag.diff{color:#5B6B7C}

.ekg-card{padding:0; overflow:hidden; position:relative; background:#FDFEFF}
.ekg-card .ekg-label{
  position:absolute; top:10px; left:12px; z-index:2;
  font-size:12.5px; font-weight:700; color:var(--sub); letter-spacing:1px;
  background:rgba(255,255,255,.86); padding:3px 9px; border-radius:6px; border:1px solid var(--line);
}
.ekg-card svg{display:block; width:100%; height:auto}

.prompt-card{margin-top:12px; padding:14px 16px; font-size:15px}
.prompt-card .prompt-label{font-size:12.5px; font-weight:700; color:var(--ecg-dark); letter-spacing:1px; margin-bottom:6px}

.options-card{margin-top:12px; padding:14px}
.option{
  display:flex; align-items:flex-start; gap:10px; width:100%; text-align:left;
  border:1.5px solid var(--line); border-radius:10px; padding:11px 12px; margin-bottom:9px;
  font-size:14.5px; color:var(--ink); background:#fff; transition:all .15s ease; line-height:1.5;
}
.option:last-child{margin-bottom:0}
.option:hover:not(:disabled){border-color:#9FB4C9; background:#F8FAFD}
.option .opt-key{
  flex:none; width:24px; height:24px; border-radius:7px; background:#EEF3F8; color:var(--sub);
  font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px;
}
.option.selected{border-color:var(--ink); background:#F2F6FA}
.option.selected .opt-key{background:var(--ink); color:#fff}
.option.correct{border-color:var(--ok); background:#F0FAF4}
.option.correct .opt-key{background:var(--ok); color:#fff}
.option.wrong{border-color:var(--ecg); background:#FDF1F1}
.option.wrong .opt-key{background:var(--ecg); color:#fff}
.option:disabled{cursor:default}

.feedback{margin-top:12px; border-radius:var(--radius); padding:14px 16px; border:1px solid}
.feedback.ok{border-color:#BFE3CE; background:#F0FAF4}
.feedback.no{border-color:#F2C4C4; background:#FDF1F1}
.fb-head{display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700; margin-bottom:8px}
.fb-head .fb-ico{width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none}
.feedback.ok .fb-ico{background:var(--ok); color:#fff}
.feedback.no .fb-ico{background:var(--ecg); color:#fff}
.fb-explain{font-size:14px; color:#33414F}
.fb-explain .hl{font-weight:700; color:var(--ecg-dark)}
.fb-note{margin-top:8px; font-size:13px; color:#54677A; border-top:1px dashed #D6E0EA; padding-top:8px}
.fb-note b{color:var(--ink)}

/* ===== 反馈：知识点与动画 ===== */
.fb-know{
  font-size:13px; font-weight:700; color:var(--ink); background:#fff;
  border:1px solid var(--line); border-radius:99px; padding:2px 12px;
  display:inline-block; margin-bottom:10px;
}
.feedback.ok .fb-know{color:var(--ok); border-color:#BFE3CE}
.feedback.no .fb-know{color:var(--ecg-dark); border-color:#F2C4C4}
@keyframes fbIn{from{opacity:0; transform:translateY(-4px)}to{opacity:1; transform:translateY(0)}}
.feedback{animation:fbIn .25s ease}

/* ===== 练习筛选条 ===== */
.filter-bar{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; align-items:center}
.filter-group{display:flex; gap:2px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:3px; box-shadow:var(--shadow)}
.filter-chip{border:none; background:none; font-size:13px; font-weight:600; color:var(--sub); padding:6px 13px; border-radius:8px; min-height:44px; transition:all .15s ease}
.filter-chip:hover{color:var(--ink)}
.filter-chip.on{background:var(--ink); color:#fff}
.filter-note{font-size:12px; color:var(--sub); margin-left:2px}

/* ===== 图鉴 ===== */
.atlas-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px}
.atlas-item{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  overflow:hidden; box-shadow:var(--shadow); text-align:left; display:flex; flex-direction:column;
  transition:transform .15s ease, border-color .15s ease;
}
.atlas-item:hover{transform:translateY(-2px); border-color:#9FB4C9}
.atlas-item .atlas-wave{background:#FDFEFF; border-bottom:1px solid var(--line); position:relative}
.atlas-item .atlas-wave svg{display:block; width:100%; height:auto}
.atlas-body{padding:10px 12px 13px; flex:1}
.atlas-name{font-size:14.5px; font-weight:700; color:var(--ink)}
.atlas-tags{display:flex; gap:6px; margin:6px 0 7px}
.atlas-snippet{font-size:12.5px; color:var(--sub); line-height:1.55}
.atlas-detail{padding:0 16px 18px}
.atlas-head{display:flex; align-items:center; gap:12px; margin:16px 0 12px; flex-wrap:wrap}
.atlas-head h3{font-size:17px; font-weight:700; color:var(--ink)}
.atlas-detail .ekg-card{margin:0 0 12px}

.quiz-actions{margin-top:14px; display:flex; justify-content:flex-end; gap:10px}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:44px;
  padding:11px 22px; border-radius:10px; font-size:14.5px; font-weight:700;
  transition:all .15s ease;
}
.btn-primary{background:var(--ink); color:#fff}
.btn-primary:hover{background:#2B3D4F}
.btn-primary:disabled{opacity:.4; cursor:default}
.btn-ghost{border:1.5px solid var(--line); color:var(--sub); background:#fff}
.btn-ghost:hover{border-color:#9FB4C9; color:var(--ink)}
.btn-danger{background:var(--ecg); color:#fff}
.btn-danger:hover{background:var(--ecg-dark)}
.btn-ok{background:var(--ok); color:#fff}
.btn-ok:hover{background:#187C4B}

/* ===== 考核 ===== */
.exam-bar{
  display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
  border-radius:var(--radius); padding:12px 16px; margin-bottom:14px; box-shadow:var(--shadow);
}
.exam-timer{
  font-family:var(--mono); font-size:22px; font-weight:700; color:var(--ink); letter-spacing:1px;
  padding:2px 12px; border-radius:8px; background:#F2F6FA; border:1px solid var(--line);
}
.exam-timer.low{color:#fff; background:var(--ecg); border-color:var(--ecg)}
.exam-info{flex:1; font-size:13px; color:var(--sub)}
.exam-info b{color:var(--ink); font-size:15px}
.flag-btn{
  border:1.5px solid var(--line); border-radius:8px; padding:6px 12px; font-size:13px; font-weight:600; color:var(--sub);
}
.flag-btn.on{background:#FFF6E9; border-color:#EBCB8F; color:var(--warn)}

/* ===== 考核报告 ===== */
.report-hero{
  display:flex; align-items:center; gap:18px; padding:20px; flex-wrap:wrap;
}
.report-score{
  width:104px; height:104px; border-radius:50%; flex:none; position:relative;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:conic-gradient(var(--ecg) calc(var(--p)*1%), #E7EDF4 0);
}
.report-score::before{content:""; position:absolute; inset:9px; background:#fff; border-radius:50%}
.report-score .num{position:relative; font-size:30px; font-weight:800; color:var(--ink); font-family:var(--mono)}
.report-score .lbl{position:relative; font-size:11px; color:var(--sub); letter-spacing:1px}
.report-meta{flex:1; min-width:180px}
.report-meta .row{display:flex; justify-content:space-between; font-size:13.5px; padding:5px 0; border-bottom:1px dashed #E3EAF1; color:var(--sub)}
.report-meta .row:last-child{border:none}
.report-meta .row b{color:var(--ink)}
.report-verdict{font-size:15px; font-weight:700; margin-top:6px}
.verdict-pass{color:var(--ok)} .verdict-fail{color:var(--ecg-dark)} .verdict-mid{color:var(--warn)}
.report-list{margin-top:14px; padding:4px 16px 14px}
.r-item{display:flex; gap:12px; align-items:flex-start; padding:11px 0; border-bottom:1px solid #EEF2F7}
.r-item:last-child{border:none}
.r-mark{flex:none; width:26px; height:26px; border-radius:8px; font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center; margin-top:1px}
.r-mark.ok{background:#F0FAF4; color:var(--ok)}
.r-mark.no{background:#FDF1F1; color:var(--ecg)}
.r-body{flex:1; font-size:13.5px}
.r-body .rhythm{font-weight:700; color:var(--ink)}
.r-body .ans{color:var(--sub); font-size:12.5px; margin-top:2px}
.r-body .ans b.ok{color:var(--ok)} .r-body .ans b.no{color:var(--ecg-dark)}

/* ===== 错题本 ===== */
.empty-state{
  text-align:center; padding:46px 20px; color:var(--sub);
}
.empty-state .ico{width:64px; height:64px; margin:0 auto 14px; opacity:.35}
.empty-state p{font-size:14.5px}
.wrong-list{padding:4px 16px 14px}
.w-item{display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid #EEF2F7}
.w-item:last-child{border:none}
.w-info{flex:1}
.w-info .rhythm{font-weight:700; font-size:14.5px}
.w-info .qtype{font-size:12px; color:var(--sub); margin-top:1px}
.w-act{display:flex; gap:6px}

/* ===== 统计 ===== */
.stats-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
.stat-cell{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 12px; text-align:center; box-shadow:var(--shadow)}
.stat-cell .v{font-size:26px; font-weight:800; font-family:var(--mono); color:var(--ink); line-height:1.2}
.stat-cell .v small{font-size:15px; color:var(--sub); font-weight:600}
.stat-cell .k{font-size:12px; color:var(--sub); margin-top:3px}
.rhythm-stats{margin-top:14px; padding:16px; }
.rs-row{display:flex; align-items:center; gap:10px; margin-bottom:9px; font-size:13px}
.rs-name{width:110px; flex:none; color:var(--ink); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rs-track{flex:1; height:10px; background:#EDF2F7; border-radius:99px; overflow:hidden}
.rs-bar{height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg,#D63031,#E8734F); transition:width .4s ease}
.rs-num{width:64px; flex:none; text-align:right; font-family:var(--mono); font-size:12.5px; color:var(--sub)}
.exam-history{margin-top:14px; padding:4px 16px 14px}
.h-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid #EEF2F7; font-size:13.5px}
.h-row:last-child{border:none}
.h-date{color:var(--sub); width:110px; flex:none; font-size:12.5px}
.h-score{font-family:var(--mono); font-weight:700; width:56px; flex:none}
.h-correct{color:var(--sub); flex:1; font-size:12.5px}
.h-bar{width:90px; height:8px; background:#EDF2F7; border-radius:99px; overflow:hidden; flex:none}
.h-bar i{display:block; height:100%; background:var(--ok); border-radius:99px}

/* ===== 底部 ===== */
footer{
  max-width:880px; margin:0 auto; padding:6px 20px 34px; color:#7C8CA0; font-size:12px; line-height:1.7;
}
footer .disclaimer{
  background:#F7FAFD; border:1px dashed #D6E0EA; border-radius:10px; padding:10px 14px; margin-bottom:12px;
}
footer b{color:#54677A}

/* ===== 响应式 ===== */
@media (max-width:640px){
  .monitor-inner{padding:12px 14px 10px}
  .brand{font-size:15px}
  .brand .sub{display:none}
  .monitor-wave{max-width:150px; height:38px}
  .mode-nav{padding:0 14px; gap:8px; grid-template-columns:repeat(3,1fr)}
  .atlas-grid{grid-template-columns:1fr}
  main{padding:14px 14px 32px}
  .mode-btn{padding:11px 4px; font-size:13px}
  .quiz-actions{flex-direction:column}
  .quiz-actions .btn{width:100%}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .exam-bar{flex-wrap:wrap}
  .exam-info{flex:1 1 100%; order:3}
  .rs-name{width:92px}
  .rs-num{width:56px}
  .h-date{width:90px}
  .h-bar{width:60px}
  .report-hero{gap:14px}
  .report-score{width:92px; height:92px}
  .report-score .num{font-size:26px}
}
</style>
</head>
<body>

<header class="monitor">
  <div class="monitor-inner">
    <div class="brand">
      <svg class="logo" width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#D63031"/>
        <path d="M4 18h5l3-8 5 13 4-11 3 6h4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      ECG 心电图识别训练<span class="sub">护理版</span>
    </div>
    <div class="monitor-wave" id="monitorWave" aria-hidden="true"></div>
  </div>
</header>

<nav class="mode-nav" id="modeNav">
  <button class="mode-btn active" data-mode="quiz">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-6 4 12 3-9 2 3h3"/></svg>
    练习
  </button>
  <button class="mode-btn" data-mode="exam">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    考核
  </button>
  <button class="mode-btn" data-mode="wrong">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8a2 2 0 0 1 2 2v14l-6-3-6 3V6a2 2 0 0 1 2-2z"/></svg>
    错题<span class="badge hidden" id="wrongBadge">0</span>
  </button>
  <button class="mode-btn" data-mode="stats">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    统计
  </button>
  <button class="mode-btn" data-mode="atlas">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z"/><path d="M4 5l5 7 3-5 3 7 5-9"/></svg>
    图鉴
  </button>
</nav>

<main id="app">

  <!-- ===== 视图：练习 ===== -->
  <section id="view-quiz" class="view">
    <div class="filter-bar" id="quizFilters">
      <div class="filter-group" id="filterDiff">
        <button class="filter-chip on" data-f="all">全部难度</button>
        <button class="filter-chip" data-f="1">基础</button>
        <button class="filter-chip" data-f="2">进阶</button>
        <button class="filter-chip" data-f="3">高危</button>
      </div>
      <div class="filter-group" id="filterType">
        <button class="filter-chip on" data-f="all">全部题型</button>
        <button class="filter-chip" data-f="wave">波形识别</button>
        <button class="filter-chip" data-f="case">临床情境</button>
      </div>
      <span class="filter-note" id="quizFilterNote"></span>
    </div>
    <div class="quiz-head">
      <div class="progress-track"><div class="progress-bar" id="quizBar"></div></div>
      <div class="quiz-meta">
        <span id="quizCount" class="tag">1 / 20</span>
        <span id="quizType" class="tag wave">波形识别</span>
        <span id="quizDiff" class="tag diff">基础</span>
      </div>
    </div>
    <div class="card ekg-card" id="ekgCard">
      <div class="ekg-label" id="ekgLabel">ECG · 6 秒</div>
      <svg id="ekgSvg" role="img" aria-label="心电图波形"></svg>
    </div>
    <div class="card prompt-card">
      <div class="prompt-label">题干</div>
      <p id="quizPrompt"></p>
    </div>
    <div class="card options-card">
      <div id="quizOptions"></div>
    </div>
    <div class="feedback hidden" id="quizFeedback">
      <div class="fb-head">
        <span class="fb-ico" id="fbIco"></span>
        <span id="fbTitle"></span>
      </div>
      <div class="fb-know" id="fbKnow"></div>

// ===== 波形引擎 =====
// 坐标系：viewBox 300x110，1 单位 = 0.5mm；按 25mm/s 纸速，6 秒 = 300 单位；基线 y=55
(function(){
var W=300, H=110, BASE=55;
var C_GRID_L='#E7EDF4', C_GRID_D='#C9D5E2', C_TRACE='#D63031';

function grid(){
  var s='';
  for(var x=2;x<W;x+=2){
    var big=x%10===0;
    s+='<line x1="'+x+'" y1="0" x2="'+x+'" y2="'+H+'" stroke="'+(big?C_GRID_D:C_GRID_L)+'" stroke-width="'+(big?0.6:0.3)+'"/>';
  }
  for(var y=2;y<H;y+=2){
    var big2=y%10===0;
    s+='<line x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+'" stroke="'+(big2?C_GRID_D:C_GRID_L)+'" stroke-width="'+(big2?0.6:0.3)+'"/>';
  }
  s+='<line x1="0" y1="'+BASE+'" x2="'+W+'" y2="'+BASE+'" stroke="#B9C6D6" stroke-width="0.8"/>';
  return s;
}

// P 波（圆丘，ph>0 向上）
function pWave(t0, pw, ph){
  var h=BASE-ph;
  return 'M '+t0+','+BASE+' C '+(t0+pw*0.3)+','+h+' '+(t0+pw*0.7)+','+h+' '+(t0+pw)+','+BASE;
}

// 单个完整心搏 P-QRS-T（或裁剪部分）
function beat(t0,o){
  o=o||{};
  var pr=o.pr||8, qrs=o.qrs||4;
  var qh=o.qh||3, rh=o.rh||20, sh=o.sh||4;
  var pw=o.pw||5, ph=o.ph||3;
  var st=o.st||0, stb=o.stb||0;
  var th=o.th||5, tw=o.tw||8;
  var rnotch=!!o.rnotch, wideS=o.wideS||0;
  var noP=!!o.noP, noT=!!o.noT;
  var tQ=noP?t0:t0+pr;
  var d='';
  if(!noP) d+=pWave(t0,pw,ph);
  d+='M '+tQ+','+BASE+' L '+(tQ+qrs*0.25)+','+(BASE+qh)+' L '+(tQ+qrs*0.52)+','+(BASE-rh);
  if(rnotch){ d+=' L '+(tQ+qrs*0.62)+','+(BASE-rh*0.72)+' L '+(tQ+qrs*0.72)+','+(BASE-rh); }
  d+=' L '+(tQ+qrs*0.8)+','+(BASE+sh);
  if(wideS>0){ d+=' L '+(tQ+qrs*0.87)+','+(BASE+sh*0.5)+' L '+(tQ+qrs*0.93)+','+(BASE+sh*1.2)+' L '+(tQ+qrs)+','+BASE; }
  else { d+=' L '+(tQ+qrs)+','+BASE; }
  var tJ=tQ+qrs, tT0=tJ+4, tT1=tT0+tw;
  if(st>0){
    var jb=BASE-st*0.3, tb=BASE-st;
    d+=' M '+tJ+','+jb+' C '+(tJ+1.5)+','+(tb-3-stb)+' '+(tJ+3)+','+tb+' '+tT0+','+tb;
  }else if(st<0){
    var dn=-st;
    d+=' M '+tJ+','+(BASE+dn*0.3)+' L '+tT0+','+(BASE+dn);
  }else{
    d+=' M '+tJ+','+BASE+' L '+tT0+','+BASE;
  }
  if(!noT){
    if(th>0){ d+=' C '+(tT0+tw*0.35)+','+(BASE-th)+' '+(tT0+tw*0.65)+','+(BASE-th)+' '+tT1+','+BASE; }
    else{ d+=' C '+(tT0+tw*0.35)+','+(BASE-th)+' '+(tT0+tw*0.65)+','+(BASE-th)+' '+tT1+','+BASE; }
  }
  d+=' M '+tT1+','+BASE+' L '+(tT1+2)+','+BASE;
  return d;
}
function beatEnd(o){ o=o||{}; var pr=o.noP?0:(o.pr||8), qrs=o.qrs||4, tw=o.tw||8; return pr+qrs+4+tw+2; }

// 基线锯齿（AF 细颤 / AFL 大锯齿）
function fWave(x0,x1,period,amp){
  var d='M '+x0+','+BASE;
  var up=true;
  for(var x=x0+period/2;x<x1;x+=period/2){
    d+=' L '+x.toFixed(1)+','+(BASE+(up?-amp:amp));
    up=!up;
  }
  return d;
}

// 室颤：多频率正弦叠加
function vfPath(){
  var d='', first=true;
  for(var x=0;x<=W;x+=1.5){
    var y=BASE+Math.sin(x*0.5)*8+Math.sin(x*0.18+2.1)*6+Math.sin(x*1.6+0.7)*3.5+Math.sin(x*0.85+4)*2.5;
    d+=(first?'M '+x.toFixed(1)+','+y.toFixed(1):' L '+x.toFixed(1)+','+y.toFixed(1));
    first=false;
  }
  return d;
}

function rhythmPath(key){
  var d='';
  var i,t,rr;
  switch(key){
    case 'nsr':      // 正常窦性心律 75bpm
      rr=3000/75;
      for(t=0;t<W;t+=rr){ d+=beat(t,{}); d+=' M '+(t+beatEnd({}))+','+BASE+' L '+Math.min(t+rr,W)+','+BASE; }
      break;
    case 'stach':    // 窦性心动过速 120bpm
      rr=3000/120;
      for(t=0;t<W;t+=rr){ d+=beat(t,{pr:7,tw:6}); }
      break;
    case 'brady':    // 窦性心动过缓 45bpm
      rr=3000/45;
      for(t=0;t<W;t+=rr){ d+=beat(t,{}); d+=' M '+(t+beatEnd({}))+','+BASE+' L '+Math.min(t+rr,W)+','+BASE; }
      break;
    case 'pac':      // 房性早搏：基础75，第3个提前且P'低矮
      i=0;t=0;
      while(t<W-20){
        if(i===3){ d+=beat(t,{pr:8,ph:2}); t+=27; }
        else { d+=beat(t,{}); t+=40; }
        i++;
      }
      break;
    case 'pvc':      // 室性早搏：基础75，第3个提前宽大无P
      i=0;t=0;
      while(t<W-20){
        if(i===3){ d+=beat(t,{noP:true,qrs:7,rh:23,sh:6,th:-8,tw:9}); t+=30; }
        else { d+=beat(t,{}); t+=40; }
        i++;
      }
      break;
    case 'af':       // 心房颤动：RR绝对不齐，无P，f波
      d+=fWave(0,W,9,1.5);
      t=6;
      while(t<W-20){ var step=26+Math.random()*20; d+=beat(t,{noP:true,qrs:4,th:5,tw:8}); t+=step; }
      break;
    case 'afl':      // 心房扑动：锯齿F波，2:1传导
      d+=fWave(0,W,10,4.5);
      for(t=10;t<W;t+=20){ d+=beat(t,{noP:true,qrs:4,th:5,tw:8}); }
      break;
    case 'svt':      // 室上速：窄QRS快且整齐，180bpm
      rr=3000/180;
      for(t=2;t<W-16;t+=rr){ d+=beat(t,{noP:true,qrs:4,th:5,tw:6}); }
      break;
    case 'vt':       // 室速：宽大QRS整齐，150bpm，T反向
      rr=20;
      for(t=3;t<W;t+=rr){ d+=beat(t,{noP:true,qrs:7,rh:21,th:-7,tw:7}); }
      break;
    case 'vf':       // 心室颤动
      d+=vfPath();
      break;
    case '1st':      // 一度AVB：PR>0.20s
      rr=3000/70;
      for(t=0;t<W;t+=rr){ d+=beat(t,{pr:16,tw:8}); }
      break;
    case '2d1':      // 二度I型文氏：PR逐渐延长→脱落
      var prs=[10,13,16,19], tP=4; i=0;
      while(tP<W-20){
        if(i<4){ d+=beat(tP,{pr:prs[i],qrs:4,th:5,tw:8}); }
        else { d+=pWave(tP,5,3); d+=' M '+(tP+5)+','+BASE+' L '+(tP+36)+','+BASE; }
        i++; if(i>4){i=0;}
        tP+=36;
      }
      break;
    case '2d2':      // 二度II型莫氏II：PR固定，间歇脱落(3:2)
      tP=4; i=0;
      while(tP<W-18){
        if(i<2){ d+=beat(tP,{pr:10,qrs:4,th:5,tw:8}); }
        else { d+=pWave(tP,5,3); d+=' M '+(tP+5)+','+BASE+' L '+(tP+30)+','+BASE; }
        i++; if(i>2){i=0;}
        tP+=30;
      }
      break;
    case '3rd':      // 三度AVB：P与QRS各自规律、互不相关
      for(t=2;t<W;t+=40){ d+=pWave(t,5,3); }
      for(t=25;t<W;t+=83){ d+=beat(t,{noP:true,qrs:7,rh:20,th:6,tw:8}); }
      break;
    case 'lbbb':     // 左束支阻滞：QRS宽大、R切迹、ST压低T倒置
      rr=3000/75;
      for(t=0;t<W;t+=rr){ d+=beat(t,{pr:8,qrs:8,rh:20,sh:5,st:-2,th:-7,tw:8,rnotch:true}); }
      break;
    case 'rbbb':     // 右束支阻滞：QRS宽、终末S增宽
      rr=3000/75;
      for(t=0;t<W;t+=rr){ d+=beat(t,{pr:8,qrs:7,rh:19,sh:4,wideS:2,th:5,tw:8}); }
      break;
    case 'stemi':    // 急性前壁STEMI：ST弓背抬高、T高尖
      rr=3000/70;
      for(t=0;t<W;t+=rr){ d+=beat(t,{pr:8,qrs:4,st:7,stb:2,th:9,tw:7}); }
      break;
    case 'asys':     // 心搏停止：直线
      d+='M 0,54.5 L '+W+',54.5';
      break;
    default:
      d+='M 0,'+BASE+' L '+W+','+BASE;
  }
  return d;
}

// 渲染完整 SVG（网格+波形）
function ekgSVG(key){
  var d=rhythmPath(key);
  return '<g>'+grid()+'<path d="'+d+'" fill="none" stroke="'+C_TRACE+'" stroke-width="1.15" stroke-linejoin="round" stroke-linecap="round"/></g>';
}

// 顶栏监护条循环波形（4 个 QRS 周期，平移 40 无缝循环）
function monitorTrace(){
  var d='';
  for(var t=0;t<=160;t+=40){
    d+='M '+(t+4)+',22 L '+(t+6)+',22 L '+(t+7)+',13 L '+(t+8)+',10 L '+(t+9)+',14 L '+(t+10)+',25 L '+(t+12)+',22 L '+(t+14)+',22 L '+(t+22)+',19 L '+(t+26)+',24 L '+(t+30)+',22 L '+(t+40)+',22';
  }
  return d;
}
window.__ekg={ekgSVG:ekgSVG,monitorTrace:monitorTrace};
})();

var $=function(id){return document.getElementById(id)};

function paintEkg(svgEl,key){
  svgEl.innerHTML='<svg viewBox="0 0 300 110" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block" role="img" aria-label="心电图波形">'+window.__ekg.ekgSVG(key)+'</svg>';
}
function diffName(d){ return d===1?'基础':(d===2?'进阶':'高危'); }

// 按筛选重新生成练习顺序
function applyFilters(){
  var ids=QUESTIONS.filter(function(q){
    if(quizFilter.diff!=='all'&&String(q.diff)!==quizFilter.diff) return false;
    if(quizFilter.type!=='all'&&q.type!==quizFilter.type) return false;
    return true;
  }).map(function(q){ return q.id; });
  $('quizFilterNote').textContent=ids.length?('当前题库 '+ids.length+' 题'):'该组合暂无题目，换个筛选试试';
  if(ids.length===0) return;   // 无匹配题时不打断现有题序
  quizMode='normal';
  quizOrder=ids.map(getQ).filter(Boolean);
  quizPos=0; renderQuiz();
}

// ---------- 练习 ----------
function renderQuiz(){
  if(quizOrder.length===0) return;
  var q=quizOrder[quizPos];
  $('quizCount').textContent=(quizPos+1)+' / '+quizOrder.length;
  $('quizType').textContent=q.type==='wave'?'波形识别':'临床情境';
  $('quizType').className='tag '+(q.type==='wave'?'wave':'case');
  $('quizDiff').textContent=diffName(q.diff);
  $('quizBar').style.width=(quizPos/(quizOrder.length)*100)+'%';
  $('ekgLabel').textContent='ECG · 6 秒 · '+(q.type==='wave'?'波形识别':'临床情境');
  paintEkg($('ekgSvg'), q.key);
  $('quizPrompt').textContent=q.prompt;
  var html='';
  q.options.forEach(function(op,i){
    html+='<button class="option" data-i="'+i+'"><span class="opt-key">'+letters[i]+'</span><span>'+op+'</span></button>';
  });
  $('quizOptions').innerHTML=html;
  var btns=$('quizOptions').querySelectorAll('.option');
  for(var k=0;k<btns.length;k++){
    (function(btn){ btn.addEventListener('click',function(){ answerQuiz(parseInt(btn.getAttribute('data-i'),10)); }); })(btns[k]);
  }
  $('quizFeedback').className='feedback hidden';
  $('btnReview').classList.add('hidden');
  $('btnNext').disabled=true;
  $('btnNext').textContent=quizPos===quizOrder.length-1?'完成本轮':'下一题';
}

function answerQuiz(i){
  var q=quizOrder[quizPos];
  if(!q||!$('btnNext').disabled) return;
  var ok=(i===q.answer);
  $('quizFeedback').classList.remove('hidden');
  $('quizFeedback').className='feedback '+(ok?'ok':'no');
  $('fbIco').textContent=ok?'✓':'✕';
  $('fbTitle').textContent=ok?'回答正确':'回答错误';
  $('fbKnow').textContent='知识点：'+q.rhythm;
  $('fbExplain').innerHTML='<span class="hl">识别要点：</span>'+q.recognize;
  $('fbNote').innerHTML='<b>护理措施：</b>'+q.nursing;
  var btns=$('quizOptions').querySelectorAll('.option');
  for(var k=0;k<btns.length;k++){
    btns[k].disabled=true;
    var idx=parseInt(btns[k].getAttribute('data-i'),10);
    if(idx===q.answer) btns[k].classList.add('correct');
    if(idx===i&&!ok) btns[k].classList.add('wrong');
  }
  store.stats.total++; if(ok) store.stats.correct++;
  var rs=rhythmStat(q.key); rs.t++; if(ok) rs.c++;
  if(!ok){
    if(store.wrong.indexOf(q.id)===-1) store.wrong.push(q.id);
    $('btnReview').classList.remove('hidden');
  }else if(quizMode==='wrong'){
    var wi=store.wrong.indexOf(q.id); if(wi>-1){ store.wrong.splice(wi,1); }
  }
  updateBadge(); save();
  $('btnNext').disabled=false;
}

function nextQuiz(){
  if(quizPos<quizOrder.length-1){ quizPos++; renderQuiz(); }
  else{
    if(quizMode==='wrong'&&store.wrong.length>0){ quizOrder=shuffle(store.wrong.map(getQ).filter(Boolean)); quizPos=0; renderQuiz(); }
    else if(quizMode==='wrong'&&store.wrong.length===0){ goMode('wrong'); }
    else{ applyFilters(); }
  }
}

// ---------- 考核 ----------
function fmtTime(s){ var m=Math.floor(s/60),ss=s%60; return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss; }
function startExam(){
  examOrder=shuffle(QUESTIONS.slice()).slice(0,10);
  examPos=0; examAnswers={}; examFlags={}; examEnded=false;
  $('examTotal').textContent=examOrder.length;
  $('examBody').classList.remove('hidden');
  $('examReport').classList.add('hidden');
  startTimer();
  renderExam();
}
function startTimer(seconds){
  if(examTimerId) clearInterval(examTimerId);
  examLeft=(typeof seconds==='number')?seconds:examOrder.length*45;
  $('examTimer').className='exam-timer';
  $('examTimer').textContent=fmtTime(examLeft);
  examTimerId=setInterval(function(){
    examLeft--;
    if(examLeft<=0){ $('examTimer').textContent='00:00'; submitExam(true); return; }
    $('examTimer').textContent=fmtTime(examLeft);
    $('examTimer').className='exam-timer'+(examLeft<=60?' low':'');
  },1000);
}
function renderExam(){
  var q=examOrder[examPos];
  if(!q) return;
  $('examCount').textContent=examPos+1;
  $('examDone').textContent=Object.keys(examAnswers).length;
  $('examEkgLabel').textContent='ECG · 6 秒 · 第 '+(examPos+1)+' / '+examOrder.length+' 题';
  paintEkg($('examEkgSvg'), q.key);
  $('examPrompt').textContent=q.prompt;
  var html='';
  q.options.forEach(function(op,i){
    var sel=(examAnswers[examPos]===i)?' selected':'';
    html+='<button class="option'+sel+'" data-i="'+i+'"><span class="opt-key">'+letters[i]+'</span><span>'+op+'</span></button>';
  });
  $('examOptions').innerHTML=html;
  var btns=$('examOptions').querySelectorAll('.option');
  for(var k=0;k<btns.length;k++){
    (function(btn){ btn.addEventListener('click',function(){ examPick(parseInt(btn.getAttribute('data-i'),10)); }); })(btns[k]);
  }
  $('btnFlag').textContent=examFlags[examPos]?'已标记':'标记待定';
  $('btnFlag').className='flag-btn'+(examFlags[examPos]?' on':'');
  $('btnPrevExam').disabled=(examPos===0);
  $('btnNextExam').textContent=examPos===examOrder.length-1?'最后一题':'下一题';
}
function examPick(i){
  if(examEnded) return;
  if(examAnswers[examPos]===i) delete examAnswers[examPos];
  else examAnswers[examPos]=i;
  renderExam();
}
function submitExam(auto){
  if(examEnded) return;
  if(!auto){ if(!confirm('确认交卷？未作答的题目将按答错计分。')) return; }
  examEnded=true;
  if(examTimerId){ clearInterval(examTimerId); examTimerId=null; }
  var correct=0;
  for(var i=0;i<examOrder.length;i++){
    var q=examOrder[i];
    var ok=(examAnswers[i]===q.answer);
    if(ok) correct++;
    store.stats.total++;
    var rs=rhythmStat(q.key); rs.t++; if(ok) rs.c++;
    if(!ok && store.wrong.indexOf(q.id)===-1) store.wrong.push(q.id);
  }
  var score=Math.round(correct/examOrder.length*100);
  var now=new Date();
  store.history.unshift({date:(now.getMonth()+1)+'/'+now.getDate()+' '+(now.getHours()<10?'0':'')+now.getHours()+':'+(now.getMinutes()<10?'0':'')+now.getMinutes(),score:score,total:examOrder.length,correct:correct});
  if(store.history.length>10) store.history.length=10;
  store.stats.correct+=correct;
  updateBadge(); save();
  $('examBody').classList.add('hidden');
  $('examReport').classList.remove('hidden');
  var verdict,cls;
  if(score>=90){ verdict='优秀，掌握良好'; cls='verdict-pass'; }
  else if(score>=70){ verdict='良好，仍有提升空间'; cls='verdict-mid'; }
  else if(score>=60){ verdict='及格线附近，建议回看错题'; cls='verdict-mid'; }
  else{ verdict='未通过，请复习错题后重考'; cls='verdict-fail'; }
  $('reportHero').innerHTML=
    '<div class="report-score" style="--p:'+score+'"><span class="num">'+score+'</span><span class="lbl">得分</span></div>'+
    '<div class="report-meta">'+
      '<div class="row"><span>作答题目</span><b>'+examOrder.length+' 题</b></div>'+
      '<div class="row"><span>答对</span><b>'+correct+' 题</b></div>'+
      '<div class="row"><span>答错</span><b>'+(examOrder.length-correct)+' 题</b></div>'+
      '<div class="row"><span>用时</span><b>'+(auto?'时间到自动交卷':'手动交卷')+'</b></div>'+
      '<div class="report-verdict '+cls+'">'+verdict+'</div>'+
    '</div>';
  var lh='';
  for(var j=0;j<examOrder.length;j++){
    var qj=examOrder[j], okj=(examAnswers[j]===qj.answer);
    var myAns = (examAnswers[j]===undefined)?'未作答':letters[examAnswers[j]]+' '+qj.options[examAnswers[j]];
    var rightAns=letters[qj.answer]+' '+qj.options[qj.answer];
    lh+='<div class="r-item"><span class="r-mark '+(okj?'ok':'no')+'">'+(okj?'✓':'✕')+'</span>'+
      '<div class="r-body"><div class="rhythm">'+(j+1)+'. '+qj.rhythm+'</div>'+
      '<div class="ans">你的答案：<b class="'+(okj?'ok':'no')+'">'+myAns+'</b> · 正确答案：<b class="ok">'+rightAns+'</b></div></div></div>';
  }
  $('reportList').innerHTML=lh;
}

// ---------- 错题 ----------
function renderWrong(){
  var empty=$('wrongEmpty'), list=$('wrongList');
  if(store.wrong.length===0){
    empty.classList.remove('hidden');
    list.classList.add('hidden');
    $('btnReWrong').classList.add('hidden');
    $('btnClearWrong').classList.add('hidden');
    $('wrongActions').classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  list.classList.remove('hidden');
  $('btnReWrong').classList.remove('hidden');
  $('btnClearWrong').classList.remove('hidden');
  var html='';
  store.wrong.forEach(function(id){
    var q=getQ(id);
    if(!q) return;
    html+='<div class="w-item"><div class="w-info"><div class="rhythm">'+q.rhythm+'</div>'+
      '<div class="qtype">'+(q.type==='wave'?'波形识别':'临床情境')+' · '+diffName(q.diff)+'</div></div>'+
      '<div class="w-act"><button class="btn btn-ghost" data-act="redo" data-id="'+id+'">重练</button>'+
      '<button class="btn btn-ghost" data-act="rm" data-id="'+id+'">移除</button></div></div>';
  });
  list.innerHTML=html;
  var btns=list.querySelectorAll('button');
  for(var k=0;k<btns.length;k++){
    (function(btn){
      btn.addEventListener('click',function(){
        var act=btn.getAttribute('data-act'), id=btn.getAttribute('data-id');
        if(act==='rm'){
          var wi=store.wrong.indexOf(id); if(wi>-1){ store.wrong.splice(wi,1); save(); updateBadge(); renderWrong(); }
        }else if(act==='redo'){
          var q=getQ(id);
          quizMode='wrong'; quizOrder=[q]; quizPos=0; renderQuiz(); goMode('quiz');
        }
      });
    })(btns[k]);
  }
}

// ---------- 统计 ----------
function renderStats(){
  var total=store.stats.total, correct=store.stats.correct;
  var rate= total?Math.round(correct/total*100):0;
  $('statsGrid').innerHTML=
    '<div class="stat-cell"><div class="v">'+total+'</div><div class="k">累计答题</div></div>'+
    '<div class="stat-cell"><div class="v">'+correct+'</div><div class="k">累计答对</div></div>'+
    '<div class="stat-cell"><div class="v">'+rate+'<small>%</small></div><div class="k">综合正确率</div></div>'+
    '<div class="stat-cell"><div class="v">'+store.wrong.length+'</div><div class="k">当前错题</div></div>';
  var rows=[];
  Object.keys(store.stats.byRhythm).forEach(function(k){
    var s=store.stats.byRhythm[k];
    if(!s.t) return;
    rows.push({name:(RH_NAMES[k]||k),t:s.t,c:s.c,rate:Math.round(s.c/s.t*100)});
  });
  rows.sort(function(a,b){ return b.t-a.t; });
  var html='';
  if(rows.length===0){
    html='<div class="empty-state" style="padding:20px"><p>暂无作答数据，先去练习吧。</p></div>';
  }else{
    rows.forEach(function(r){
      html+='<div class="rs-row"><span class="rs-name">'+r.name+'</span>'+
        '<div class="rs-track"><div class="rs-bar" style="width:'+r.rate+'%"></div></div>'+
        '<span class="rs-num">'+r.rate+'% ('+r.c+'/'+r.t+')</span></div>';
    });
  }
  $('rhythmStats').innerHTML=html;
  var hh='';
  if(store.history.length===0){
    hh='<div class="empty-state" style="padding:20px"><p>暂无考核记录，去考核一次吧。</p></div>';
  }else{
    store.history.forEach(function(h){
      hh+='<div class="h-row"><span class="h-date">'+h.date+'</span>'+
        '<span class="h-score">'+h.score+'分</span>'+
        '<span class="h-correct">'+h.correct+'/'+h.total+' 正确</span>'+
        '<div class="h-bar"><i style="width:'+h.score+'%"></i></div></div>';
    });
  }
  $('examHistory').innerHTML=hh;
}

// ===== 图鉴 =====
// 显示顺序（想调整顺序就改这里；想加新波形：先在波形引擎加 case，再把 key 放进来）
var ATLAS_ORDER=['nsr','stach','brady','af','pac','pvc','afl','svt','1st','2d1','2d2','3rd','lbbb','rbbb','vt','stemi','vf','asys'];
// 一眼速查句（写给自己/同事看的口头特征）
var ATLAS_SNIPPET={
  nsr:'P-QRS-T 一个不少，整齐 60-100 次/分',
  stach:'规则且快，每个 QRS 前都有 P 波',
  brady:'规则且慢，P 波正常下传',
  af:'无 P 波、RR 绝对不齐',
  pac:'提前一个窄 QRS，前面的 P′ 长得不一样',
  pvc:'提前一个宽大畸形 QRS，前面没有 P 波',
  afl:'锯齿状 F 波，QRS 跟着 F 波走',
  svt:'窄 QRS、快且绝对整齐，看不到 P 波',
  '1st':'PR 间期拉长（>0.20s），但每个 P 都下传',
  '2d1':'PR 逐渐变长，直到掉一个 QRS（文氏）',
  '2d2':'PR 固定，突然掉一个 QRS（莫氏Ⅱ）',
  '3rd':'P 和 QRS 各跳各的，完全没关系',
  lbbb:'QRS 宽、R 有切迹，ST-T 与主波相反',
  rbbb:'QRS 宽、终末 S 增宽有切迹',
  vt:'宽大 QRS 成串出现，快而整齐',
  stemi:'ST 段弓背抬高 + T 高尖',
  vf:'完全乱掉的粗颤波，无有效心排',
  asys:'一条直线，先排除电极脱落'
};
// 取某个波形 key 的第一道波形识别题（用于图鉴的名称/解析）
function waveQByKey(k){
  for(var i=0;i<QUESTIONS.length;i++){ if(QUESTIONS[i].type==='wave'&&QUESTIONS[i].key===k) return QUESTIONS[i]; }
  return null;
}
function renderAtlas(){
  var html='';
  ATLAS_ORDER.forEach(function(k){
    var q=waveQByKey(k);
    if(!q) return;
    html+='<button class="atlas-item" data-key="'+k+'">'+
      '<div class="atlas-wave"><svg viewBox="0 0 300 110" preserveAspectRatio="xMidYMid meet" style="width:100%;display:block">'+window.__ekg.ekgSVG(k)+'</svg></div>'+
      '<div class="atlas-body">'+
        '<div class="atlas-name">'+q.rhythm+'</div>'+
        '<div class="atlas-tags"><span class="tag diff">'+diffName(q.diff)+'</span></div>'+
        '<div class="atlas-snippet">'+ATLAS_SNIPPET[k]+'</div>'+
      '</div></button>';
  });
  $('atlasGrid').innerHTML=html;
  var items=$('atlasGrid').querySelectorAll('.atlas-item');
  for(var i=0;i<items.length;i++){
    (function(btn){ btn.addEventListener('click',function(){ openAtlasDetail(btn.getAttribute('data-key')); }); })(items[i]);
  }
}
function openAtlasDetail(k){
  var q=waveQByKey(k);
  if(!q) return;
  $('atlasGrid').classList.add('hidden');
  $('atlasDetail').classList.remove('hidden');
  $('atlasDetailName').textContent=q.rhythm;
  $('atlasDetailTags').innerHTML='<span class="tag diff">'+diffName(q.diff)+'</span><span class="tag">'+ATLAS_SNIPPET[k]+'</span>';
  $('atlasDetailSvg').innerHTML='<svg viewBox="0 0 300 110" preserveAspectRatio="xMidYMid meet" style="width:100%;display:block">'+window.__ekg.ekgSVG(k)+'</svg>';
  $('atlasDetailRec').innerHTML='<span class="hl">识别要点：</span>'+q.recognize;
  $('atlasDetailNurse').innerHTML='<b>护理措施：</b>'+q.nursing;
}
function backToAtlas(){
  $('atlasDetail').classList.add('hidden');
  $('atlasGrid').classList.remove('hidden');
}

function updateBadge(){
  var b=$('wrongBadge');
  if(store.wrong.length>0){ b.textContent=store.wrong.length; b.classList.remove('hidden'); }
  else b.classList.add('hidden');
}
// ===== 交互与初始化 =====
var MODE_VIEWS={quiz:'view-quiz',exam:'view-exam',wrong:'view-wrong',stats:'view-stats',atlas:'view-atlas'};
function goMode(m){
  if(m!=='exam'&&examTimerId){ clearInterval(examTimerId); examTimerId=null; }
  Object.keys(MODE_VIEWS).forEach(function(k){ $('view-'+k).classList.add('hidden'); });
  $('view-'+m).classList.remove('hidden');
  var btns=$('modeNav').querySelectorAll('.mode-btn');
  for(var i=0;i<btns.length;i++){ btns[i].classList.toggle('active', btns[i].getAttribute('data-mode')===m); }
  if(m==='quiz'&&quizOrder.length===0){ applyFilters(); }
  if(m==='exam'){ if(!examOrder.length||examEnded){ startExam(); } else { if(!examTimerId) startTimer(examLeft); renderExam(); } }
  if(m==='wrong'){ renderWrong(); }
  if(m==='stats'){ renderStats(); }
  if(m==='atlas'){ renderAtlas(); }
}

function init(){
  // 顶栏监护波形 + 无缝滚动
  var st=document.createElement('style');
  st.textContent='@keyframes mwave{from{transform:translateX(0)}to{transform:translateX(-40px)}}';
  document.head.appendChild(st);
  var mw=$('monitorWave');
  mw.innerHTML='<svg viewBox="0 0 160 44" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;animation:mwave 1.5s linear infinite">'+
    '<path d="'+window.__ekg.monitorTrace()+'" fill="none" stroke="#3DDC84" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg>'+
    '<div class="scan-line"></div>';
  // 模式导航
  var navBtns=$('modeNav').querySelectorAll('.mode-btn');
  for(var i=0;i<navBtns.length;i++){
    (function(btn){ btn.addEventListener('click',function(){ goMode(btn.getAttribute('data-mode')); }); })(navBtns[i]);
  }
  // 练习筛选
  var diffChips=$('filterDiff').querySelectorAll('.filter-chip');
  for(var d=0;d<diffChips.length;d++){
    (function(chip){
      chip.addEventListener('click',function(){
        var f=chip.getAttribute('data-f');
        quizFilter.diff=f;
        for(var x=0;x<diffChips.length;x++){ diffChips[x].classList.toggle('on',diffChips[x]===chip); }
        applyFilters();
      });
    })(diffChips[d]);
  }
  var typeChips=$('filterType').querySelectorAll('.filter-chip');
  for(var tc=0;tc<typeChips.length;tc++){
    (function(chip){
      chip.addEventListener('click',function(){
        var f=chip.getAttribute('data-f');
        quizFilter.type=f;
        for(var x=0;x<typeChips.length;x++){ typeChips[x].classList.toggle('on',typeChips[x]===chip); }
        applyFilters();
      });
    })(typeChips[tc]);
  }
  // 练习
  $('btnNext').addEventListener('click',nextQuiz);
  $('btnReview').addEventListener('click',function(){ goMode('wrong'); });
  // 考核
  $('btnPrevExam').addEventListener('click',function(){ if(examPos>0){ examPos--; renderExam(); } });
  $('btnNextExam').addEventListener('click',function(){ if(examPos<examOrder.length-1){ examPos++; renderExam(); } });
  $('btnFlag').addEventListener('click',function(){
    if(examEnded) return;
    if(examFlags[examPos]) delete examFlags[examPos]; else examFlags[examPos]=true;
    renderExam();
  });
  $('btnSubmit').addEventListener('click',function(){ submitExam(false); });
  $('btnRetryExam').addEventListener('click',startExam);
  $('btnBackQuiz').addEventListener('click',function(){ applyFilters(); goMode('quiz'); });
  // 图鉴
  $('btnAtlasBack').addEventListener('click',backToAtlas);
  // 键盘快捷键：A-D 答题，Enter 下一题（练习），←/→ 切题（考核）
  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
    var active=document.querySelector('.mode-btn.active');
    if(!active) return;
    var mode=active.getAttribute('data-mode');
    var k=e.key;
    if(mode==='quiz'){
      if(/^[a-dA-D]$/.test(k)){
        var idx=k.toLowerCase().charCodeAt(0)-97;
        var opt=$('quizOptions').querySelectorAll('.option')[idx];
        if(opt&&!opt.disabled) opt.click();
      }else if(k==='Enter'&&!$('btnNext').disabled){
        $('btnNext').click();
      }
    }else if(mode==='exam'&&!examEnded){
      if(/^[a-dA-D]$/.test(k)){
        var idx2=k.toLowerCase().charCodeAt(0)-97;
        var opt2=$('examOptions').querySelectorAll('.option')[idx2];
        if(opt2) opt2.click();
      }else if(k==='ArrowRight'&&examPos<examOrder.length-1){ examPos++; renderExam(); }
      else if(k==='ArrowLeft'&&examPos>0){ examPos--; renderExam(); }
    }
  });
  // 错题
  $('btnReWrong').addEventListener('click',function(){
    if(!store.wrong.length) return;
    quizMode='wrong'; quizOrder=shuffle(store.wrong.map(getQ).filter(Boolean)); quizPos=0; renderQuiz(); goMode('quiz');
  });
  $('btnClearWrong').addEventListener('click',function(){
    if(!store.wrong.length) return;
    if(confirm('确认清空全部 '+store.wrong.length+' 道错题记录？')){
      store.wrong=[]; save(); updateBadge(); renderWrong();
    }
  });
  updateBadge();
  applyFilters();
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
